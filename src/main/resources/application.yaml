# Perfil padrão (dev): usado quando nenhum profile é ativado.
spring:
  application:
    name: registro-coristas-api

  config:
    # carrega o .env local (ignorado no Git); se não existir, valem os defaults abaixo
    import: optional:file:.env[.properties]

  output:
    ansi:
      enabled: always # logs coloridos

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:registro_coristas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate # schema só via Flyway
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true # colore as palavras-chave do SQL

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE # mostra os valores dos parâmetros (?) das queries
