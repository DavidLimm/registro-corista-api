# Ativado via SPRING_PROFILES_ACTIVE=prod (Render). Sem defaults nas credenciais:
# se a variável de ambiente não existir, a aplicação falha ao subir.
server:
  port: ${PORT:8080}

spring:
  output:
    ansi:
      enabled: detect

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate # fixo, não pode ser sobrescrito por env var
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO

# sem default: o do application.yaml é só de dev e público (está no Git). Sem a variável, a aplicação não sobe.
jwt:
  segredo: ${JWT_SEGREDO}
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}

# não expor a documentação da API publicamente
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
